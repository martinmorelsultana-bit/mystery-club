<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>Mystery Club — Chambre 404</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f4f6;background:#080b13}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#18233c,#080b13 70%)}button{font:inherit;cursor:pointer}main{max-width:470px;margin:auto;padding:22px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;color:#aab4c9;font-size:12px;letter-spacing:2px}.brand{color:#f5f5f5;font-weight:900}.dot{color:#f87171}h1{font-size:34px;line-height:1.05;margin:30px 0 8px}p{line-height:1.6;color:#b6bfd0}.eyebrow{font-size:12px;color:#fa8585;letter-spacing:2px}.phone{margin:24px 0;border:5px solid #343b4a;border-radius:36px;background:linear-gradient(160deg,#19243a,#0d1220);min-height:490px;box-shadow:0 24px 65px #0009;overflow:hidden}.status{display:flex;justify-content:space-between;padding:15px 23px 6px;font-size:12px;color:#cbd5e1}.screen{padding:18px}.screen h2{margin:6px 0 12px;font-size:23px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.app{border:1px solid #334155;background:#1c2940;color:white;border-radius:17px;padding:17px 5px;min-height:100px}.app span{display:block;font-size:27px;margin-bottom:9px}.app small{font-size:12px}.card{background:#192339;border:1px solid #344159;border-radius:15px;padding:15px;margin:12px 0}.card strong{display:block;margin-bottom:7px}.card p{margin:4px 0;font-size:14px}.muted{color:#9caac0;font-size:13px}.btn{background:#ef6666;color:#190d10;border:0;border-radius:12px;padding:12px 18px;font-weight:800}.secondary{background:#29364f;color:white}.back{background:none;color:#f4a0a0;border:0;padding:6px 0 14px}.choices{display:grid;gap:9px}.choice{padding:13px;text-align:left;background:#25334b;border:1px solid #4a5c78;border-radius:12px;color:white}.choice:disabled{opacity:.65}.success{color:#86efac}.error{color:#fca5a5}.progress{height:7px;border-radius:8px;background:#27354a;overflow:hidden}.progress div{height:100%;background:#ef7777;transition:width .2s}.footer{color:#738099;text-align:center;font-size:12px;margin-top:24px}input{width:100%;padding:14px;border-radius:12px;background:#0b1424;border:1px solid #50617d;color:white;font-size:18px;margin:10px 0}#error{display:none;background:#4c1515;color:white;padding:12px;white-space:pre-wrap}</style></head><body><main><div class="top"><span class="brand">MYSTERY<span class="dot">●</span>CLUB</span><span>DOSSIER 001</span></div><div id="error"></div><div id="root"></div><div class="footer">Fiction interactive · Version 6 · Fonctionne hors connexion après chargement</div></main><script>
(function(){'use strict';const root=document.getElementById('root');let state={found:[],unlocked:false,solved:false};try{const saved=JSON.parse(localStorage.getItem('mc404v6')||'null');if(saved&&Array.isArray(saved.found))state=saved}catch(e){}let page='home';const clues=[['msg','Message de 03:17'],['call','Appel de la réception'],['cam','Coupure caméra'],['log','Journal des portes'],['photo','Photo du couloir'],['note','Note du technicien']];function save(){try{localStorage.setItem('mc404v6',JSON.stringify(state))}catch(e){}}function find(id){if(!state.found.includes(id)){state.found.push(id);save()}}function html(s){root.innerHTML=s}function shell(title,body){html('<h1>'+title+'</h1><div class="phone"><div class="status"><span>03:23</span><span>●●● ▰</span></div><div class="screen"><button class="back" id="back">← Applications</button><h2>'+title+'</h2>'+body+'</div></div>');document.getElementById('back').onclick=()=>go('apps')}function go(p){page=p;if(p==='home'){html('<div class="eyebrow" style="margin-top:34px">ENQUÊTE INTERACTIVE</div><h1>CHAMBRE<br>404</h1><p>À 03:17, un client signale une présence dans sa chambre. Six minutes plus tard, il a disparu. Explore son téléphone et découvre la vérité.</p><button class="btn" id="start">OUVRIR LE DOSSIER →</button><div class="card"><strong>Votre mission</strong><p>Collectez les 6 preuves, déverrouillez les archives et identifiez ce qui s'est passé.</p></div>');document.getElementById('start').onclick=()=>go('apps');return}if(p==='apps'){html('<div class="eyebrow" style="margin-top:26px">TÉLÉPHONE DE SERVICE</div><h1>Dossier 404</h1><p class="muted">Preuves découvertes : '+state.found.length+'/6</p><div class="progress"><div style="width:'+(state.found.length/6*100)+'%"></div></div><div class="phone"><div class="status"><span>03:23</span><span>●●● ▰</span></div><div class="screen"><h2>Applications</h2><p class="muted">Touchez une application pour enquêter.</p><div class="apps">'+[['messages','💬','Messages'],['calls','📞','Appels'],['camera','📹','Caméras'],['doors','🚪','Accès'],['photos','🖼️','Photos'],['notes','📝','Notes'],['archive','🔐','Archives'],['deduce','🧩','Déductions'],['reset','↺','Rejouer']].map(a=>'<button class="app" data-go="'+a[0]+'"><span>'+a[1]+'</span><small>'+a[2]+'</small></button>').join('')+'</div></div></div>');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));return}if(p==='messages'){find('msg');shell('Messages','<div class="card"><strong>03:12 — Client, chambre 404</strong><p>« Vous avez envoyé quelqu’un réparer la ventilation ? J’entends des pas derrière le mur. »</p></div><div class="card"><strong>03:14 — Réception</strong><p>« Non monsieur. Personne n’a été envoyé. »</p></div><div class="card"><strong>03:17 — Client</strong><p>« Il y a quelqu’un dans ma chambre. »</p></div><p class="success">✓ Preuve collectée</p>');return}if(p==='calls'){find('call');shell('Appels','<div class="card"><strong>03:17 — Appel entrant · Chambre 404</strong><p>Durée : 00:21</p><p>Transcription : « La grille bouge… il y a une lumière… » [bruit métallique]</p></div><div class="card"><strong>03:19 — Sécurité</strong><p>Agent envoyé au quatrième étage.</p></div><p class="success">✓ Preuve collectée</p>');return}if(p==='camera'){find('cam');shell('Caméras','<div class="card"><strong>CAM 04 — Couloir</strong><p>03:16:58 — Image normale.</p><p>03:17:09 — Perte du signal pendant 48 secondes.</p><p>03:17:57 — Signal rétabli. Personne dans le couloir.</p></div><p class="muted">La caméra ne filme pas les gaines techniques.</p><p class="success">✓ Preuve collectée</p>');return}if(p==='doors'){find('log');shell('Journal des portes','<div class="card"><strong>Chambre 404</strong><p>03:02 — Entrée avec carte client.</p><p>03:17–03:23 — Aucune ouverture de porte.</p></div><div class="card"><strong>Accès maintenance</strong><p>03:18 — Trappe technique du 4e étage ouverte avec badge M-07.</p></div><p class="success">✓ Preuve collectée</p>');return}if(p==='photos'){find('photo');shell('Photos','<div class="card"><strong>Photo prise à 03:15</strong><p>Sur le miroir de la chambre : une fine poussière grise, tombée depuis la grille de ventilation.</p></div><div class="card"><strong>Plan de l’hôtel</strong><p>Une gaine technique relie la chambre 404 au local de maintenance.</p></div><p class="success">✓ Preuve collectée</p>');return}if(p==='notes'){find('note');shell('Notes','<div class="card"><strong>Rapport maintenance — 13 novembre</strong><p>« Badge M-07 affecté à L. Moreau. Trappe du quatrième étage défectueuse. Code de l’armoire d’archives : année de construction de l’hôtel. »</p></div><div class="card"><strong>Plaque de l’hôtel</strong><p>« Hôtel Saint-Vincent — fondé en 1987 »</p></div><p class="success">✓ Preuve collectée</p>');return}if(p==='archive'){shell('Archives',state.unlocked?'<div class="card"><strong>Journal interne confidentiel</strong><p>03:11 — L. Moreau entre dans le local technique.</p><p>03:18 — Badge M-07 active la trappe.</p><p>03:20 — Sortie par escalier de service.</p><p>03:21 — Un téléphone est retrouvé dans la chambre. Le client reste introuvable.</p></div><p class="success">✓ Archives ouvertes</p>':'<p>Un code à 4 chiffres protège les archives. Cherche l’indice dans les notes.</p><input id="code" inputmode="numeric" maxlength="4" placeholder="Code à 4 chiffres"><button class="btn" id="unlock">Déverrouiller</button><p id="feedback"></p>');if(!state.unlocked)document.getElementById('unlock').onclick=()=>{if(document.getElementById('code').value.trim()==='1987'){state.unlocked=true;save();go('archive')}else document.getElementById('feedback').textContent='Code incorrect. Consulte les notes.'};return}if(p==='deduce'){let ready=state.found.length===6&&state.unlocked;shell('Déductions',state.solved?'<div class="card"><strong class="success">Enquête résolue</strong><p>Les indices suggèrent que quelqu’un a emprunté les accès techniques, sans passer par la porte de la chambre. Le badge M-07 relie L. Moreau à la trappe, mais le sort du client reste un mystère.</p></div><button class="btn secondary" id="again">Rejouer</button>':!ready?'<p>Pour présenter votre conclusion, rassemblez les 6 preuves et ouvrez les archives.</p><p class="muted">Preuves : '+state.found.length+'/6 · Archives : '+(state.unlocked?'ouvertes':'verrouillées')+'</p>':'<p>Comment une personne a-t-elle pu accéder à la chambre sans ouvrir sa porte ?</p><div class="choices"><button class="choice" data-answer="wrong">Elle est passée par la fenêtre.</button><button class="choice" data-answer="right">Elle est passée par la gaine technique.</button><button class="choice" data-answer="wrong">La caméra a simplement raté une sortie par la porte.</button></div><p id="feedback"></p>');if(state.solved)document.getElementById('again').onclick=()=>go('reset');else if(ready)document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.dataset.answer==='right'){state.solved=true;save();go('deduce')}else document.getElementById('feedback').textContent='Cette hypothèse ne correspond pas au journal des portes.'});return}if(p==='reset'){if(confirm('Recommencer l’enquête et effacer la progression ?')){state={found:[],unlocked:false,solved:false};save();go('home')}else go('apps')}}try{go('home')}catch(e){document.getElementById('error').style.display='block';document.getElementById('error').textContent='Erreur du jeu : '+e.message}})();
</script></body></html>
