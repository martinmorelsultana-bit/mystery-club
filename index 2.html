<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b11"><title>Mystery Club — Chambre 404 · V3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f1f1f6;background:#080a10;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#21223b 0%,#0a0c14 55%,#06070c 100%)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:490px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:#0c0f18;box-shadow:0 0 80px #0008}.status{height:48px;padding:16px 23px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.3px}.top{display:flex;align-items:center;gap:12px;padding:13px 20px 18px}.back{border:1px solid #34384a;color:#fff;background:#171c2b;border-radius:12px;padding:9px 12px}.top h1{font-size:19px;margin:0}.top p{font-size:11px;color:#939ab0;margin:3px 0 0}.content{padding:0 18px 110px}.intro{min-height:calc(100dvh - 48px);display:flex;flex-direction:column;justify-content:center;padding:30px 25px 55px;background:linear-gradient(180deg,#10142288,#090c13 80%),radial-gradient(ellipse at 60% 25%,#752a2d55,transparent 52%)}.logo{letter-spacing:4px;color:#f37b7b;font-size:12px;font-weight:800}.intro h1{font-size:clamp(46px,12vw,65px);letter-spacing:-3px;line-height:.98;margin:22px 0}.intro .sub{color:#b5b6c3;line-height:1.7;font-size:15px}.door{height:220px;max-width:270px;margin:26px auto 20px;width:70%;border:9px solid #252637;border-bottom:0;background:linear-gradient(90deg,#181a27,#29212b 60%,#161924);box-shadow:inset 18px 0 24px #0008,0 0 55px #d9474216;display:flex;align-items:center;justify-content:center;position:relative}.door:after{content:'';position:absolute;right:22px;top:60%;width:8px;height:19px;background:#b79c78;border-radius:4px}.door b{font-size:36px;color:#c9b9a8;letter-spacing:5px;text-shadow:0 2px 12px #000}.btn{border:0;background:#e76868;color:#1c0b11;padding:15px 18px;border-radius:14px;font-weight:800;width:100%;margin-top:12px}.btn.secondary{background:#202637;color:#f2f2f8;border:1px solid #353c51}.eyebrow{font-size:10px;letter-spacing:2px;color:#ed8181;font-weight:800;text-transform:uppercase}.hero{background:linear-gradient(145deg,#2e2637,#151b2c 70%);border:1px solid #494051;border-radius:20px;padding:20px;margin-bottom:18px}.hero h2{font-size:26px;margin:10px 0 8px}.muted{color:#9ba3b8;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.app{border:1px solid #30384b;background:linear-gradient(155deg,#202638,#141925);border-radius:17px;padding:17px 7px 14px;text-align:center;color:#e9e9f1;min-height:100px}.app .emoji{display:block;font-size:29px;margin-bottom:10px}.app span:last-child{font-size:11px;font-weight:700}.section{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#9da4b7;margin:22px 0 12px;font-weight:800}.card{background:#171d2b;border:1px solid #30384a;border-radius:16px;padding:16px;margin:10px 0}.card h3{margin:0 0 8px;font-size:16px}.card p{font-size:13px;color:#b1b8c8;line-height:1.65;margin:6px 0}.tag{font-size:10px;letter-spacing:.7px;border-radius:100px;padding:5px 9px;background:#343143;color:#f2c1c1;display:inline-block}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.line{border-bottom:1px solid #31394a;padding:12px 0}.line:last-child{border:0}.chat{display:flex;flex-direction:column;gap:10px;padding:10px 0}.bubble{padding:12px 14px;border-radius:17px;background:#293043;max-width:88%;font-size:14px;line-height:1.5;align-self:flex-start}.bubble.me{align-self:flex-end;background:#704044}.bubble small{display:block;color:#c0bac7;font-size:10px;margin-top:6px;text-align:right}.camera{background:#050709;border:1px solid #3b414b;border-radius:14px;aspect-ratio:16/10;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:12px 0}.camera:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#ffffff09 4px);pointer-events:none}.camera .hall{height:85%;width:45%;background:linear-gradient(90deg,#15181b,#30343b,#111317);border:7px solid #4b4e55;display:flex;align-items:center;justify-content:center;color:#999;letter-spacing:3px;font-size:25px}.camera .stamp{position:absolute;left:12px;top:10px;font-size:10px;color:#b9e4d5;font-family:monospace}.camera .rec{position:absolute;right:12px;top:10px;font-size:10px;color:#ff7070}.camera.off .hall{filter:brightness(.07)}.camera.off:after{content:'SIGNAL PERDU';position:absolute;background:#111b;padding:8px 14px;letter-spacing:3px;color:#f37b7b;font-size:13px;font-weight:800}.choice{width:100%;display:block;text-align:left;color:#f0f0f5;background:#1b2232;border:1px solid #394155;border-radius:13px;padding:14px;margin:9px 0;font-size:13px}.choice:active{background:#333b50}.input{background:#111625;border:1px solid #3c455c;border-radius:12px;padding:15px;color:#fff;width:100%;font-size:18px;letter-spacing:4px;text-align:center}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f1e7e7;color:#19131b;border-radius:13px;padding:13px 16px;max-width:440px;width:calc(100% - 35px);box-shadow:0 12px 40px #0009;z-index:5;font-size:13px;font-weight:700}.footer{position:absolute;bottom:0;width:100%;background:#101521ee;border-top:1px solid #2d3445;display:flex;justify-content:space-around;padding:13px 8px max(14px,env(safe-area-inset-bottom))}.footer button{background:none;border:0;color:#929ab0;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}.footer button.active{color:#f28a8a}.progress{height:5px;background:#303748;border-radius:6px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:#ec7777;transition:width .3s}.evidence{border-left:3px solid #d97171;padding-left:12px}.locked{opacity:.55}.small{font-size:12px}.end{background:linear-gradient(160deg,#2b293b,#101521);border:1px solid #70515c;padding:24px;border-radius:20px}.end h2{font-size:27px}.end p{line-height:1.75;color:#c8cbd4}.pill{font-size:11px;color:#c8cbd6;background:#272d3b;border-radius:99px;padding:7px 10px}.fade{animation:appear .3s ease}@keyframes appear{from{opacity:.3;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><div id="root" class="shell"></div><script>
(()=>{'use strict';const KEY='mysteryclub_404_v3';const initial={started:false,tab:'home',screen:'home',evidence:[],pin:false,blackout:false,culprit:false,finished:false,hints:0};let s;try{s={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...initial}}const $=document.getElementById('root');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const ev={call:['Appel de 03:17','La victime affirme qu’une personne se trouve dans sa chambre.'],door:['Journal des serrures','Aucune sortie par la porte principale entre 03:17 et 03:23.'],camera:['Coupure vidéo','La caméra du quatrième étage perd le signal à 03:19 pendant 47 secondes.'],badge:['Badge M-12','Le passage technique a été ouvert à 03:20 avec le badge M-12.'],shift:['Planning du personnel','Le badge M-12 est attribué à Victor Dumas, responsable de sécurité.'],note:['Message effacé','Le client voulait signaler des vols dans les chambres avant sa disparition.'],hatch:['Plan du quatrième étage','La chambre 404 donne sur une trappe de maintenance, invisible depuis le couloir.']};const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let toastTimer;function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2700)}function add(k){if(!s.evidence.includes(k)){s.evidence.push(k);save();toast('Nouvelle preuve ajoutée au dossier : '+ev[k][0])}}const has=k=>s.evidence.includes(k);function set(screen,tab){s.screen=screen;s.tab=tab||s.tab;save();render();window.scrollTo(0,0)}const btn=(label,action,extra='')=>`<button class="choice" data-action="${action}" ${extra}>${label}</button>`;const top=(title,sub='')=>`<div class="status"><span>03:24</span><span>●●●  ▰</span></div><header class="top"><button class="back" data-action="home">‹</button><div><h1>${title}</h1><p>${sub}</p></div></header>`;const foot=()=>`<nav class="footer"><button data-action="home" class="${s.tab==='home'?'active':''}"><span>⌂</span>Accueil</button><button data-action="dossier" class="${s.tab==='dossier'?'active':''}"><span>◈</span>Preuves</button><button data-action="deductions" class="${s.tab==='deductions'?'active':''}"><span>◇</span>Déductions</button><button data-action="help" class="${s.tab==='help'?'active':''}"><span>?</span>Aide</button></nav>`;const wrap=(title,body,sub='DOSSIER 001 · CHAMBRE 404')=>top(title,sub)+`<main class="content fade">${body}</main>`+foot();const intro=()=>`<div class="status"><span>MYSTERY CLUB</span><span>001 / 404</span></div><div class="intro"><div class="logo">DOSSIER CONFIDENTIEL</div><div class="door"><b>404</b></div><h1>CHAMBRE<br>404<span style="color:#ed7777">.</span></h1><div class="sub">03:17. Un homme appelle la réception. Six minutes plus tard, il a disparu. La porte n'a jamais été ouverte.<br><br><strong>Vous avez accès à son téléphone et aux archives de l'hôtel.</strong></div><button class="btn" data-action="start">Ouvrir l'enquête →</button><p class="muted" style="text-align:center">Enquête fictive · Jeu solo · Sauvegarde locale</p></div>`;function home(){const apps=[['💬','Messages','messages'],['📞','Appels','calls'],['📷','Caméras','cameras'],['🗂️','Archives','archives'],['📝','Notes','notes'],['🗺️','Plans','plans']];return wrap('Téléphone d’enquête',`<div class="hero"><span class="eyebrow">ENQUÊTE ACTIVE · 03:24</span><h2>Où est passé Adrien ?</h2><p class="muted">Adrien Moreau, chambre 404. Votre mission : reconstituer la nuit et identifier qui a manipulé les preuves.</p><div class="row"><span class="small">${s.evidence.length}/7 preuves découvertes</span><span class="pill">${s.finished?'Résolue':'En cours'}</span></div><div class="progress"><div style="width:${s.evidence.length/7*100}%"></div></div></div><div class="section">Applications sécurisées</div><div class="grid">${apps.map(([i,n,a])=>`<button class="app" data-action="${a}"><span class="emoji">${i}</span><span>${n}</span></button>`).join('')}</div><div class="section">Votre mission</div><div class="card"><h3>Trois questions</h3><p>Comment Adrien a-t-il quitté la chambre ? Qui possédait l'accès nécessaire ? Pourquoi les images sont-elles manquantes ?</p>${btn('Ouvrir le tableau de déductions →','deductions')}</div>`)}function messages(){return wrap('Messages',`<div class="section">Conversations récupérées</div><div class="card"><div class="row"><h3>Inès · Réception</h3><span class="tag">03:16</span></div><div class="chat"><div class="bubble">Monsieur Moreau, tout va bien à l'étage ?<small>03:12</small></div><div class="bubble me">Je crois qu'on me surveille. Ne faites confiance à personne de la sécurité.<small>03:14</small></div><div class="bubble">Je peux envoyer quelqu'un ?<small>03:15</small></div><div class="bubble me">Non. J'ai des preuves des vols. Je vais vous appeler.<small>03:16</small></div></div><button class="btn secondary" data-action="collect-note">Conserver la conversation</button></div><div class="card"><h3>Numéro inconnu</h3><div class="chat"><div class="bubble">Arrête de fouiller dans les dossiers. Dernier avertissement.<small>02:51</small></div><div class="bubble me">Je sais pour le badge. Je ne me tairai pas.<small>02:55</small></div></div><p>Le numéro de l'expéditeur a été masqué.</p></div>`)}function calls(){return wrap('Historique des appels',`<div class="card"><div class="row"><h3>Réception de l’hôtel</h3><span class="tag">03:17</span></div><p>Appel sortant · Durée : 00:19</p><div class="card" style="background:#101725"><span class="eyebrow">TRANSCRIPTION</span><p style="color:#e2e4ec">« Il y a quelqu'un dans ma chambre. Écoutez-moi. Si je disparais, cherchez derrière le... »</p><p>Fin de l'enregistrement. Bruit métallique détecté.</p></div><button class="btn secondary" data-action="collect-call">Ajouter l'appel aux preuves</button></div><div class="card"><h3>Interphone de sécurité</h3><p>03:23 · Agent Victor Dumas signale une chambre vide.</p></div>`)}function cameras(){return wrap('Surveillance',`<div class="card"><h3>CAM 04 — Couloir du 4e</h3><div class="camera ${s.blackout?'off':''}"><div class="hall">404</div><span class="stamp">14/11/26 ${s.blackout?'03:19:00':'03:18:59'}</span><span class="rec">● REC</span></div><p>Une interruption a été détectée dans la séquence vidéo.</p>${btn(s.blackout?'Revenir à 03:18:59':'Avancer à 03:19:00','camera-toggle')}<button class="btn secondary" data-action="collect-camera">Enregistrer l'anomalie</button></div><div class="card"><h3>Journal technique</h3><p>03:19:00 — perte du signal<br>03:19:47 — retour du signal<br>Cause officielle : « redémarrage automatique »</p></div>`)}function archives(){return wrap('Archives de l’hôtel',`<div class="card"><span class="eyebrow">ARCHIVES CHIFFRÉES</span><h3>Journal d'accès</h3><p>Le code de déverrouillage est l'heure exacte de l'appel d'Adrien, au format HHMM.</p>${s.pin?`<span class="tag">Accès autorisé</span><div class="line"><p>03:17 — Chambre 404 : aucune sortie</p><p>03:20 — Porte technique T4 : badge M-12</p><p>03:23 — Chambre 404 : entrée de sécurité</p></div><button class="btn secondary" data-action="collect-door">Conserver le journal de serrure</button><button class="btn secondary" data-action="collect-badge">Conserver le journal du badge</button>`:`<input class="input" id="pin" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Code à quatre chiffres"><button class="btn" data-action="unlock">Déverrouiller</button>`}</div><div class="card"><h3>Registre du personnel</h3><p>Victor Dumas — Chef de sécurité — Badge M-12<br>Inès Laurent — Réception — Badge R-03<br>Malik Benali — Maintenance — Badge T-08</p><button class="btn secondary" data-action="collect-shift">Ajouter le registre aux preuves</button></div>`)}function notes(){return wrap('Notes personnelles',`<div class="card"><span class="eyebrow">NOTE D’ADRIEN · 02:44</span><h3>« Les vols ne sont pas des accidents »</h3><p>Trois chambres, trois objets disparus. Chaque fois, le rapport a été signé par le même responsable. Je dois montrer les documents à Inès.</p><p>Si quelque chose arrive, chercher dans le passage technique derrière la penderie.</p><button class="btn secondary" data-action="collect-note">Conserver la note</button></div><div class="card"><h3>Brouillon non envoyé</h3><p>« Je vais provoquer une réaction. Si la caméra coupe, j'aurai ma réponse. »</p></div>`)}function plans(){return wrap('Plans du bâtiment',`<div class="card"><span class="eyebrow">ÉTAGE 04 · PLAN DE SERVICE</span><h3>La sortie invisible</h3><div style="background:#0b111c;border:1px dashed #7e8799;border-radius:14px;padding:22px;text-align:center;line-height:2.2;font-family:monospace;font-size:13px;color:#d7e0e9">┌──────────────┐<br>│ CHAMBRE 404 │<br>│ PENDERIE ▣──┼── PASSAGE T4<br>└──────────────┘</div><p>Une trappe derrière la penderie relie la chambre au couloir de maintenance T4. Ce passage n'est pas filmé par la caméra du couloir principal.</p><button class="btn secondary" data-action="collect-hatch">Ajouter le plan aux preuves</button></div>`)}function dossier(){return wrap('Dossier de preuves',`<div class="hero"><span class="eyebrow">DOSSIER 001</span><h2>${s.evidence.length} / 7 preuves</h2><div class="progress"><div style="width:${s.evidence.length/7*100}%"></div></div><p class="muted">Les preuves sont enregistrées automatiquement sur cet appareil.</p></div>${Object.entries(ev).map(([k,v])=>`<div class="card ${has(k)?'':'locked'}"><div class="row"><h3>${has(k)?'✓':'🔒'} ${esc(v[0])}</h3><span class="tag">${has(k)?'Trouvée':'Inconnue'}</span></div><p>${has(k)?esc(v[1]):'Explorez les applications pour découvrir cet élément.'}</p></div>`).join('')}`)}function deductions(){let first=has('hatch')&&has('door'),second=has('badge')&&has('shift')&&has('camera');return wrap('Tableau de déductions',`<div class="hero"><span class="eyebrow">RECONSTITUTION</span><h2>Relier les faits</h2><p class="muted">Pour avancer, découvrez les preuves puis répondez aux questions. Une erreur ne bloque jamais l'enquête.</p></div><div class="card"><span class="tag">ÉTAPE 1</span><h3>Comment Adrien a-t-il quitté la chambre ?</h3><p>Indices requis : journal des serrures et plan du bâtiment.</p>${first?`${btn('Par la fenêtre','wrong-exit')}${btn('Par le passage de maintenance','right-exit')}${btn('Par la porte principale','wrong-exit')}`:'<p>🔒 Deux preuves sont encore nécessaires.</p>'}${s.hatchSolved?'<p style="color:#91dfb4">✓ Déduction confirmée</p>':''}</div><div class="card"><span class="tag">ÉTAPE 2</span><h3>Qui pouvait organiser la coupure et ouvrir le passage ?</h3><p>Indices requis : badge, planning et coupure caméra.</p>${second?`${btn('Inès Laurent','wrong-culprit')}${btn('Victor Dumas','right-culprit')}${btn('Malik Benali','wrong-culprit')}`:'<p>🔒 Trois preuves sont encore nécessaires.</p>'}${s.culprit?'<p style="color:#91dfb4">✓ Suspect identifié</p>':''}</div>${s.hatchSolved&&s.culprit?`<div class="card"><span class="eyebrow">DERNIÈRE DÉCISION</span><h3>Pourquoi Adrien a-t-il disparu ?</h3>${btn('Il a été enlevé dans le couloir','wrong-motive')}${btn('Il a utilisé le passage pour échapper à Dumas et préserver ses preuves','right-motive')}${btn('Il a quitté l’hôtel par la fenêtre','wrong-motive')}</div>`:''}`)}function ending(){return wrap('Dossier résolu',`<div class="end"><span class="eyebrow">AFFAIRE CLASSÉE · DOSSIER 001</span><h2>La vérité derrière la porte</h2><p>Adrien enquêtait sur des vols commis dans l'hôtel. Il avait découvert que les rapports de sécurité étaient systématiquement modifiés par Victor Dumas.</p><p>En provoquant un appel à la réception, Adrien espérait attirer l'attention sur la surveillance dont il faisait l'objet. Lorsque la caméra s'est coupée, il a emprunté la trappe derrière la penderie pour se cacher dans le passage technique.</p><p>À 03:20, le badge M-12 de Dumas a ouvert ce même passage. Dumas voulait récupérer les preuves. Adrien s'était déjà réfugié dans un local de service, où il a finalement été retrouvé sain et sauf.</p><p>La coupure vidéo et le journal d'accès ont permis de confondre Dumas. La disparition n'était pas une fuite par la porte : c'était une tentative de protection.</p><div class="row"><span class="pill">7 preuves possibles</span><span class="pill">${s.evidence.length} collectées</span></div><button class="btn" data-action="home">Retour au téléphone</button><button class="btn secondary" data-action="reset">Recommencer l’enquête</button></div>`)}function help(){return wrap('Centre d’aide',`<div class="card"><h3>Comment jouer ?</h3><p>Explorez les six applications. Conservez les preuves importantes. Consultez le tableau « Déductions » pour relier les faits. Votre progression est enregistrée automatiquement dans Safari sur cet appareil.</p></div><div class="card"><h3>Indice progressif</h3><p>${['Commencez par l’historique des appels. L’heure exacte sert aussi de code.','Lisez le plan du quatrième étage et le journal des serrures.','Comparez le badge M-12 au registre du personnel et à l’anomalie de la caméra.'][Math.min(s.hints,2)]}</p><button class="btn secondary" data-action="hint">${s.hints<2?'Afficher un autre indice':'Revoir les indices'}</button></div><div class="card"><h3>Progression</h3><p>Une ancienne sauvegarde V2 ne sera pas supprimée, mais la V3 commence une nouvelle enquête.</p><button class="btn secondary" data-action="reset">Recommencer depuis le début</button></div>`)}function render(){if(!s.started){$.innerHTML=intro();return}const pages={home,messages,calls,cameras,archives,notes,plans,dossier,deductions,ending,help};$.innerHTML=(pages[s.screen]||home)()};document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='start'){s.started=true;set('home','home');return}if(['home','dossier','deductions','help'].includes(a)){set(a,a);return}if(['messages','calls','cameras','archives','notes','plans'].includes(a)){set(a,'home');return}if(a==='camera-toggle'){s.blackout=!s.blackout;save();render();return}if(a==='unlock'){if(document.getElementById('pin')?.value.trim()==='0317'){s.pin=true;save();toast('Archives déverrouillées');render()}else toast('Code incorrect. Regardez l’heure de l’appel.');return}if(a.startsWith('collect-')){const k=a.slice(8);if(ev[k])add(k);render();return}if(a==='right-exit'){s.hatchSolved=true;save();toast('Déduction validée : sortie par la trappe.');render();return}if(a==='right-culprit'){s.culprit=true;save();toast('Déduction validée : badge M-12.');render();return}if(a==='right-motive'){s.finished=true;save();set('ending','deductions');return}if(a.startsWith('wrong-')){toast('Cette hypothèse ne correspond pas à toutes les preuves.');return}if(a==='hint'){s.hints=Math.min(2,s.hints+1);save();render();return}if(a==='reset'){if(confirm('Effacer la progression de Chambre 404 V3 et recommencer ?')){s={...initial};save();render()}return}});render()})();
</script></body></html>
